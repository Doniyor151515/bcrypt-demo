<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bcrypt Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {



      
      font-family: 'Segoe UI', sans-serif;
      background:black;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 { font-size: 28px; margin-bottom: 8px; color: #60a5fa; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }

    /* Status */
    #status-bar {
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
    }
    .status-on  { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
    .status-off { background: #451a03; color: #fb923c; border: 1px solid #ea580c; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 480px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab.active { background: #1d4ed8; color: white; border-color: #1d4ed8; }

    /* Card */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
    }

    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #3b82f6; }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }

    /* Result */
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .result.success { background: #14532d; border: 1px solid #16a34a; color: #4ade80; }
    .result.error   { background: #450a0a; border: 1px solid #dc2626; color: #f87171; }
    .result.info    { background: #1e3a5f; border: 1px solid #1d4ed8; color: #93c5fd; }

    /* Section title */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Users table */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px; color: #64748b; border-bottom: 1px solid #334155; }
    td { padding: 8px; border-bottom: 1px solid #1e293b; color: #cbd5e1; word-break: break-all; }
    tr:hover td { background: #0f172a; }

    .bcrypt-info {
      background: #1e3a5f;
      border: 1px solid #1d4ed8;
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 20px;
      width: 100%;
      max-width: 480px;
      line-height: 1.7;
    }
    .bcrypt-info code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #60a5fa;
    }
  </style>
</head>
<body>

  <h1>👥 Instagram Follower</h1>
  <!-- <p class="subtitle">Parolni bcrypt bilan va bcryptsiz saqlash farqini ko'ring</p> -->

  <!-- Status -->
  <div id="status-bar">Yuklanmoqda...</div>

  <!-- Bcrypt tushuntirish -->

    <strong>📖 Bcrypt nima?</strong><br><br>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('register')">Ro'yxat</button>
    <button class="tab"        onclick="showTab('login')">Kirish</button>
    <button class="tab"        onclick="showTab('users')">Bazadagi userlar</button>
  </div>

  <!-- Register -->
  <div id="tab-register" class="card">
    <div class="section-title">📝 Ro'yxatdan o'tish</div>
    <label>Username</label>
    <input id="reg-username" placeholder="username" />
    <label>Parol</label>
    <input id="reg-password" type="password" placeholder="parol123" />
    <button onclick="register()">Ro'yxatdan o'tish</button>
    <div id="reg-result" class="result"></div>
  </div>

  <!-- Login -->
  <div id="tab-login" class="card" style="display:none">
    <div class="section-title">🔑 Kirish</div>
    <label>Username</label>
    <input id="login-username" placeholder="username" />
    <label>Parol</label>
    <input id="login-password" type="password" placeholder="parol123" />
    <button onclick="login()">Kirish</button>
    <div id="login-result" class="result"></div>
  </div>

  <!-- Users -->
  <div id="tab-users" class="card" style="display:none">
    <div class="section-title">👥 Bazadagi foydalanuvchilar</div>
    <button onclick="loadUsers()" style="margin-bottom:16px">Yangilash</button>
    <div id="users-result"></div>
  </div>

  <script>
    const API = 'https://bcrypt-demo-production.up.railway.app'
    // ↑ Railway URL ni o'zgartiring

    // Status
    async function loadStatus() {
      try {
        const res  = await fetch(`${API}/status`)
        const data = await res.json()
        const bar  = document.getElementById('status-bar')
        bar.textContent = data.message
        bar.className   = data.bcrypt_on ? 'status-on' : 'status-off'
      } catch {
        document.getElementById('status-bar').textContent = '⚠️ Server bilan aloqa yo\'q'
        document.getElementById('status-bar').className   = 'status-off'
      }
    }

    // Tabs
    function showTab(name) {
      ['register','login','users'].forEach(t => {
        document.getElementById(`tab-${t}`).style.display = t === name ? 'block' : 'none'
      })
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', ['register','login','users'][i] === name)
      })
      if (name === 'users') loadUsers()
    }

    // Register
    async function register() {
      const username = document.getElementById('reg-username').value
      const password = document.getElementById('reg-password').value
      const el       = document.getElementById('reg-result')

      try {
        const res  = await fetch(`${API}/register`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        })
        const data = await res.json()

        if (res.ok) {
          el.className     = 'result success'
          el.style.display = 'block'
          el.textContent   = JSON.stringify(data, null, 2)
        } else {
          el.className     = 'result error'
          el.style.display = 'block'
          el.textContent   = data.error
        }
        loadStatus()
      } catch {
        el.className     = 'result error'
        el.style.display = 'block'
        el.textContent   = 'Server bilan aloqa yo\'q'
      }
    }

    // Login
    async function login() {
      const username = document.getElementById('login-username').value
      const password = document.getElementById('login-password').value
      const el       = document.getElementById('login-result')

      try {
        const res  = await fetch(`${API}/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        })
        const data = await res.json()

        el.className     = data.success ? 'result success' : 'result error'
        el.style.display = 'block'
        el.textContent   = JSON.stringify(data, null, 2)
      } catch {
        el.className     = 'result error'
        el.style.display = 'block'
        el.textContent   = 'Server bilan aloqa yo\'q'
      }
    }
